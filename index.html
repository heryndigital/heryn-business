<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heryn Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0906; --bg-soft:#120d08;
    --surface:#1b140d; --surface-2:#241a10; --surface-3:#150f09;
    --border:rgba(246,238,222,.12); --border-strong:rgba(246,238,222,.20);
    --ink:#f6efe2; --ink-2:#d8cbb0; --ink-muted:#a99b80;
    --gold-100:#ffe7b8; --gold-300:#f7c463; --gold-500:#ec9f2e; --gold-700:#b96b12; --gold-900:#7a4308;
    --accent:var(--gold-500); --accent-2:var(--gold-300); --accent-ink:#1a1108;
    --accent-soft:rgba(236,159,46,.16);
    --gold-gradient: linear-gradient(120deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));
    --good:#5cc088; --good-bg:rgba(92,192,136,.16);
    --warn:#ec9f2e; --warn-bg:rgba(236,159,46,.16);
    --bad:#e2604a; --bad-bg:rgba(226,96,74,.16);
    --info:#7fa3d9; --info-bg:rgba(127,163,217,.16);
    --danger:#e2604a; --danger-bg:rgba(226,96,74,.16);
    --shadow: 0 20px 50px -22px rgba(0,0,0,.7), 0 4px 14px rgba(0,0,0,.4);
    --shadow-gold: 0 10px 30px -10px rgba(236,159,46,.45);
    --radius: 14px;
  }
  :root[data-theme="light"]{
    --bg:#faf6ec; --bg-soft:#f3ecdb;
    --surface:#ffffff; --surface-2:#f4eee0; --surface-3:#efe7d5;
    --border:rgba(36,26,16,.10); --border-strong:rgba(36,26,16,.18);
    --ink:#241a10; --ink-2:#4a3c28; --ink-muted:#8a7a5f;
    --gold-300:#b96b12;
    --accent-ink:#1a1108;
    --accent-soft:rgba(185,107,18,.13);
    --shadow: 0 16px 40px -20px rgba(60,40,10,.16), 0 3px 10px rgba(60,40,10,.06);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--ink); position:relative;
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(246,238,222,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,238,222,.05) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 30%, transparent 82%);
    mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 30%, transparent 82%);
  }
  body::after{
    content:""; position:fixed; z-index:0; pointer-events:none;
    top:-280px; left:50%; transform:translateX(-50%);
    width:760px; height:520px; border-radius:999px; filter:blur(120px);
    background:radial-gradient(circle, rgba(236,159,46,.20), transparent 70%);
  }
  h1,h2,.display{ font-family:"Anton", ui-sans-serif, sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.01em; line-height:1; text-wrap:balance; }
  h3{ font-family:"Manrope",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--ink-muted); }
  .mono{ font-family:"Manrope", ui-sans-serif, sans-serif; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }
  ::placeholder{ color:var(--ink-muted); opacity:.75; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:"Manrope",sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--gold-300);
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:999px; background:var(--gold-500); flex:none;
    box-shadow:0 0 0 0 rgba(236,159,46,.6); animation:pulse-dot 2.2s ease-out infinite;
  }
  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(236,159,46,.55);}
    70%{box-shadow:0 0 0 8px rgba(236,159,46,0);}
    100%{box-shadow:0 0 0 0 rgba(236,159,46,0);}
  }

  .select, .input, .textarea{
    font-size:13px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:10px; padding:8px 11px;
    font-family:inherit; width:100%;
  }
  .select option{ background:var(--surface-2); color:var(--ink); }
  .select:focus, .input:focus, .textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .textarea{ font-family:inherit; resize:vertical; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
    font-family:"Manrope",sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer;
    transition:transform .15s ease, background .15s, box-shadow .25s; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface); transform:translateY(-1px); }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold-gradient); color:var(--accent-ink); border-color:transparent; box-shadow:var(--shadow-gold); }
  .btn-primary:hover{ background:var(--gold-gradient); color:var(--accent-ink); transform:translateY(-2px); box-shadow:0 16px 40px -12px rgba(236,159,46,.6); }
  .btn-ghost{ border-color:var(--border-strong); background:rgba(246,238,222,.03); }
  .btn-ghost:hover{ background:rgba(246,238,222,.08); }
  .btn-danger{ color:var(--danger); border-color:var(--danger-bg); background:transparent; }
  .btn-danger:hover{ background:var(--danger-bg); }
  .btn-icon{ padding:8px; width:34px; height:34px; justify-content:center; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; transform:none !important; }
  .btn-sm{ font-size:12px; padding:6px 12px; }
  .btn-block{ width:100%; justify-content:center; }

  .avatar{
    width:26px; height:26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#1a1108; font-family:"Manrope",sans-serif;
  }
  .avatar-img{ border-radius:50%; flex:none; object-fit:cover; display:block; box-shadow:0 0 0 1px var(--border-strong); }
  .who{ display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:999px; padding:4px 12px 4px 4px; font-size:13px; }
  .who span.name{ font-weight:600; }

  /* ---------- Login ---------- */
  .login-screen{ position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border-strong); border-radius:20px; padding:30px 26px; box-shadow:var(--shadow); text-align:center; }
  .login-logo{ height:42px; width:auto; margin:0 auto 14px; display:block; }
  .login-card .eyebrow{ justify-content:center; margin-bottom:18px; }
  .login-card h2{ font-size:21px; margin:0 0 18px; }
  .login-card .field{ text-align:left; }
  .login-error{ font-size:12.5px; color:var(--danger); background:var(--danger-bg); border-radius:8px; padding:8px 10px; margin-bottom:13px; text-align:left; }

  .field{ margin-bottom:13px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); }
  .field .hint{ font-size:11px; color:var(--ink-muted); font-weight:500; text-transform:none; letter-spacing:0; margin-top:-2px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field-row .field{ flex:1; min-width:150px; }

  /* ---------- App shell: sidebar layout ---------- */
  .biz-app{ display:flex; min-height:100vh; position:relative; z-index:1; }
  .sidebar{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .sidebar-brand img{ height:28px; width:auto; }
  .sidebar-brand .name{ font-family:"Anton",sans-serif; font-size:15px; letter-spacing:.02em; }
  .sidebar-group{ margin-bottom:6px; }
  .sidebar-group-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-muted); padding:14px 10px 6px; }
  .sidebar-link{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--ink-2); transition:background .15s, color .15s; user-select:none;
  }
  .sidebar-link:hover{ background:var(--surface-2); color:var(--ink); }
  .sidebar-link.active{ background:var(--gold-gradient); color:var(--accent-ink); box-shadow:var(--shadow-gold); }
  .sidebar-link .ic{ width:16px; text-align:center; flex:none; }
  .sidebar-footer{ margin-top:auto; padding:12px 10px 2px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); }
  .sidebar-footer b{ display:block; color:var(--ink-2); font-size:13px; margin-bottom:1px; }

  .biz-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .biz-topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
    padding:14px 24px; background:rgba(11,9,6,.78); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  :root[data-theme="light"] .biz-topbar{ background:rgba(250,246,236,.85); }
  .biz-topbar .title{ font-family:"Anton",sans-serif; font-size:22px; letter-spacing:.01em; }
  .biz-topbar .sub{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .biz-content{ flex:1; min-width:0; padding:22px 26px 50px; max-width:1180px; width:100%; margin:0 auto; }
  .month-stepper{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:999px; padding:4px 6px; }
  .month-stepper .lbl{ font-size:13px; font-weight:700; min-width:120px; text-align:center; }
  .saved-flag{ font-size:11.5px; color:var(--good); font-weight:700; opacity:0; transition:opacity .3s; display:flex; align-items:center; gap:4px; }
  .saved-flag.show{ opacity:1; }

  /* ---------- Cards / grid ---------- */
  .card-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .screen-head{ margin-bottom:20px; }
  .screen-head .title{ font-family:"Anton",sans-serif; font-size:26px; margin-bottom:4px; }
  .screen-head .sub{ font-size:13px; color:var(--ink-muted); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:820px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }
  .stack{ display:flex; flex-direction:column; gap:16px; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
  @media (max-width:980px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .kpi-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:6px; }
  .kpi-value{ font-family:"Anton",sans-serif; font-size:22px; letter-spacing:.01em; }
  .kpi-sub{ font-size:11.5px; color:var(--ink-muted); margin-top:4px; }
  .kpi-card.good .kpi-value{ color:var(--good); } .kpi-card.bad .kpi-value{ color:var(--bad); } .kpi-card.warn .kpi-value{ color:var(--warn); }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge-good{ color:var(--good); background:var(--good-bg); }
  .badge-warn{ color:var(--warn); background:var(--warn-bg); }
  .badge-bad{ color:var(--bad); background:var(--bad-bg); }
  .badge-accent{ color:var(--gold-300); background:var(--accent-soft); }
  .badge-neutral{ color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border-strong); }

  .table{ width:100%; border-collapse:collapse; font-size:13px; }
  .table th{ text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); padding:8px 10px; border-bottom:1px solid var(--border-strong); }
  .table td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .table tr:last-child td{ border-bottom:none; }
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; overflow-x:auto; }
  .table-wrap .table{ min-width:560px; }
  .table input.cell-input{ width:100%; background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 6px; color:var(--ink); font-family:inherit; font-size:13px; }
  .table input.cell-input:hover{ background:var(--surface-2); border-color:var(--border-strong); }
  .table input.cell-input:focus{ background:var(--surface-2); border-color:var(--accent); outline:none; }
  .row-del{ border:none; background:transparent; color:var(--ink-muted); cursor:pointer; font-size:15px; padding:4px 6px; }
  .row-del:hover{ color:var(--danger); }

  .progress-bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:999px; transition:width .3s; }

  .empty-tip{ border:1.5px dashed var(--border-strong); border-radius:12px; padding:20px; text-align:center; color:var(--ink-muted); font-size:13px; }

  /* ---------- Dashboard ---------- */
  .jarvis-card{
    display:flex; align-items:center; gap:20px; padding:22px 24px; border-radius:18px; margin-bottom:18px;
    background:linear-gradient(135deg, rgba(236,159,46,.14), rgba(122,67,8,.10)); border:1px solid rgba(236,159,46,.30);
  }
  .jarvis-ring{ flex:none; }
  .jarvis-body{ flex:1; min-width:0; }
  .jarvis-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .jarvis-msg{ font-size:14px; color:var(--ink-2); line-height:1.55; margin:0; }
  .alert-item, .diag-row, .sugg-item{ display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .alert-item:last-child, .diag-row:last-child, .sugg-item:last-child{ border-bottom:none; }
  .alert-icon{ flex:none; font-size:16px; line-height:1.3; }
  .alert-title{ font-weight:700; font-size:13px; color:var(--ink); }
  .alert-body{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; line-height:1.45; }
  .diag-dot{ width:9px; height:9px; border-radius:50%; flex:none; margin-top:4px; }
  .diag-label{ font-size:12.5px; color:var(--ink-muted); }
  .diag-value{ font-weight:700; font-size:13.5px; }
  .sugg-idx{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .sugg-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---------- Funnel ---------- */
  .funnel-row{ margin-bottom:14px; }
  .funnel-row:last-child{ margin-bottom:0; }
  .funnel-label{ font-size:12.5px; color:var(--ink-2); margin-bottom:5px; display:flex; justify-content:space-between; }
  .funnel-track{ height:26px; border-radius:8px; background:var(--surface-2); overflow:hidden; position:relative; }
  .funnel-fill{ height:100%; display:flex; align-items:center; padding-left:10px; font-size:12px; font-weight:700; color:#1a1108; border-radius:8px; transition:width .3s; white-space:nowrap; }
  .funnel-step{ font-size:11px; color:var(--ink-muted); margin-top:3px; }

  /* ---------- Glossary ---------- */
  .gloss-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .gloss-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .gloss-head .term{ font-weight:800; font-size:15px; }
  .gloss-head .full{ font-size:12px; color:var(--gold-300); }
  .gloss-sec{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin:8px 0 3px; }
  .gloss-sec:first-of-type{ margin-top:0; }
  .gloss-text{ font-size:13px; color:var(--ink-2); line-height:1.5; }
  .gloss-ideal{ background:var(--info-bg); border:1px solid rgba(127,163,217,.3); border-radius:8px; padding:8px 11px; font-size:12.5px; color:var(--ink-2); margin-top:8px; }
  .gloss-ideal b{ color:var(--info); }

  /* ---------- Onboarding wizard ---------- */
  .wizard-overlay{ position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(4,3,2,.75); backdrop-filter:blur(4px); }
  .wizard-card{ width:100%; max-width:480px; background:var(--surface); border:1px solid var(--border-strong); border-radius:22px; padding:32px 28px; box-shadow:var(--shadow); }
  .wizard-dots{ display:flex; justify-content:center; gap:10px; margin-bottom:22px; }
  .wizard-dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink-muted); }
  .wizard-dot.active{ background:var(--gold-gradient); color:var(--accent-ink); border-color:transparent; }
  .wizard-dot.done{ background:var(--good-bg); color:var(--good); border-color:transparent; }
  .wizard-icon{ font-size:38px; text-align:center; margin-bottom:10px; }
  .wizard-title{ text-align:center; font-family:"Anton",sans-serif; font-size:22px; margin-bottom:6px; }
  .wizard-sub{ text-align:center; font-size:13px; color:var(--ink-muted); margin-bottom:22px; }
  .wizard-feature{ display:flex; gap:12px; padding:10px 0; }
  .wizard-feature .ic{ font-size:20px; flex:none; }
  .wizard-feature b{ display:block; font-size:13.5px; }
  .wizard-feature span{ font-size:12px; color:var(--ink-muted); }
  .wizard-nav{ display:flex; gap:10px; margin-top:24px; }
  .wizard-nav .btn{ flex:1; justify-content:center; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink); padding:10px 18px; border-radius:999px;
    font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:500;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .biz-content{ padding:16px 14px 40px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>

<body>

  function colorForName(name){
    var s = String(name||'?'); var h = 0;
    for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name){
    var parts = String(name||'?').trim().split(/\s+/);
    if (!parts[0]) return '?';
    return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function avatarHTML(name, size){
    size = size || 24;
    var photo = AVATAR_PHOTOS[name];
    if (photo) return '<img class="avatar-img" src="'+photo+'" style="width:'+size+'px;height:'+size+'px;" alt="'+esc(name)+'">';
    return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+colorForName(name)+';font-size:'+Math.round(size*0.42)+'px;">'+initials(name)+'</span>';
  }

  var LS_THEME = 'heryn-business-theme-v1';
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = $('themeToggle');
    if (btn) btn.textContent = t === 'light' ? '🌙' : '☀️';
    try{ localStorage.setItem(LS_THEME, t); }catch(e){}
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(LS_THEME); }catch(e){}
    applyTheme(saved === 'light' ? 'light' : 'dark');
  }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function rerenderPreserveFocus(renderFn){
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = null, selEnd = null, supportsSelection = true;
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){ supportsSelection = false; }
    renderFn();
    if (activeId){
      var el = document.getElementById(activeId);
      if (el){
        el.focus();
        if (supportsSelection && selStart != null){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        } else {
          // type="number" (and similar) inputs don't support setSelectionRange —
          // reassigning the value is the standard trick to push the caret to the end.
          try{ var v = el.value; el.value = ''; el.value = v; }catch(e){}
        }
      }
    }
  }
  function flashSaved(){
    var f = $('savedFlag'); if (!f) return;
    f.classList.add('show');
    clearTimeout(flashSaved._h);
    flashSaved._h = setTimeout(function(){ f.classList.remove('show'); }, 1800);
  }

  function fmtBRL(v){ return Number(v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }

  // ============================================================
  // Motor de indicadores (KPIs) — o coração do Heryn Business
  // ============================================================
  function calcKPIs(month, profile){
    if (!month || !profile) return null;
    var n = Number(month.revenue)||0, r = Number(month.varCosts)||0, l = Number(month.mktSpend)||0,
        o = Number(month.adRevenue)||0, s = Number(month.leads)||0, a = Number(month.newClients)||0;
    var hasAds = (l>0 && o>0);
    var fixedTotal = (Number(profile.fixedTeam)||0) + (Number(profile.fixedRent)||0) + (Number(profile.fixedTools)||0) + (Number(profile.fixedOther)||0);
    var grossProfit = n - r;
    var netProfit = grossProfit - fixedTotal - l;
    var grossMargin = n>0 ? (grossProfit/n)*100 : 0;
    var netMargin = n>0 ? (netProfit/n)*100 : 0;
    var roas = hasAds ? (o/l) : null;
    var cac = (l>0 && a>0) ? (l/a) : null;
    var convRate = (s>0 && a>0) ? (a/s)*100 : null;
    var breakEven = grossMargin>0 ? (fixedTotal+l)/(grossMargin/100) : null;
    var breakEvenPct = (breakEven && n>0) ? (n/breakEven)*100 : null;
    return {
      revenue:n, varCosts:r, mktSpend:l, adRevenue:o, leads:s, newClients:a, hasAds:hasAds,
      fixedTotal:fixedTotal, grossProfit:grossProfit, netProfit:netProfit,
      grossMargin:grossMargin, netMargin:netMargin, roas:roas, cac:cac, convRate:convRate,
      breakEven:breakEven, breakEvenPct:breakEvenPct
    };
  }

  function computeHealth(kpis, month){
    if (!kpis) return { score:0, label:'Crítico', color:'var(--bad)' };
    if (kpis.revenue === 0) return { score:0, label:'Crítico', color:'var(--bad)' };
    var pts = 0;
    var f = kpis.netMargin;
    pts += f>=30?40 : f>=20?32 : f>=10?22 : f>=5?12 : f>=0?4 : 0;
    if (kpis.roas === null) pts += 10;
    else { var d = kpis.roas; pts += d>=6?20 : d>=4?16 : d>=3?12 : d>=2?7 : 1; }
    if (kpis.convRate === null) pts += 10;
    else { var y = kpis.convRate; pts += y>=5?20 : y>=3?15 : y>=1?8 : 2; }
    var budgets = (month && month.budgets) || [];
    var withBudget = budgets.filter(function(b){ return Number(b.allocated)>0; });
    if (!withBudget.length) pts += 10;
    else {
      var onTrack = withBudget.filter(function(b){ return Number(b.spent) <= Number(b.allocated); }).length;
      pts += Math.round((onTrack/withBudget.length)*20);
    }
    var score = Math.min(100, Math.max(0, Math.round(pts)));
    var label = score>=85?'Excelente' : score>=70?'Saudável' : score>=50?'Atenção' : score>=30?'Em Risco' : 'Crítico';
    var color = score>=85?'#5cc088' : score>=70?'#84cc16' : score>=50?'#ec9f2e' : score>=30?'#f97316' : '#e2604a';
    return { score:score, label:label, color:color };
  }

  function jarvisMessage(kpis, health, month, profile){
    var L = (profile.ownerName||'').trim().split(/\s+/)[0] || 'empresário';
    var H = monthNameLong(month.id).split(' de ')[0];
    if (kpis.revenue === 0) return 'Olá, '+L+'. Insira os dados do mês para que eu possa analisar a saúde do negócio.';
    if (kpis.netProfit < 0) return H+' foi um mês crítico, '+L+'. O negócio operou com prejuízo de '+fmtBRL(Math.abs(kpis.netProfit))+'. Ação imediata é necessária — analise os alertas abaixo.';
    if (health.score >= 80) return H+' foi excelente, '+L+'. Margem líquida de '+fmtPct(kpis.netMargin)+' e negócio operando de forma saudável. Momento ideal para pensar em crescimento.';
    if (health.score >= 60) return H+' foi um mês estável, '+L+'. Há pontos a melhorar — veja os diagnósticos e siga as sugestões para otimizar os resultados.';
    return H+' pede atenção, '+L+'. Alguns indicadores estão fora do ideal. Siga as sugestões de prioridade alta para corrigir o curso.';
  }

  function computeAlerts(kpis){
    var alerts = [];
    if (kpis.netProfit < 0) alerts.push({ level:'critical', title:'Prejuízo operacional', body:'Despesas superaram faturamento em '+fmtBRL(Math.abs(kpis.netProfit))+'. Revisão urgente necessária.' });
    if (kpis.revenue>0 && kpis.netMargin>=0 && kpis.netMargin<5) alerts.push({ level:'warning', title:'Margem líquida crítica', body: fmtPct(kpis.netMargin)+' de margem — zona de risco. Um mês ruim pode gerar prejuízo.' });
    if (kpis.roas !== null && kpis.roas < 1.5) alerts.push({ level:'critical', title:'ROAS abaixo do custo', body:'Para cada R$ 1 em anúncios, retorna R$ '+fmtNum(kpis.roas,2)+'. Você está perdendo dinheiro com tráfego pago.' });
    if (kpis.convRate !== null && kpis.convRate < 0.5) alerts.push({ level:'warning', title:'Conversão muito baixa', body: fmtPct(kpis.convRate,2)+' dos leads fecham. Revise urgentemente o processo comercial.' });
    if (kpis.breakEven && kpis.revenue>0 && kpis.revenue < kpis.breakEven) alerts.push({ level:'warning', title:'Abaixo do ponto de equilíbrio', body:'Você precisa de '+fmtBRL(kpis.breakEven)+' para cobrir custos fixos. Faturou '+fmtBRL(kpis.revenue)+'.' });
    return alerts;
  }

  function computeDiagnostics(kpis){
    var d = [];
    if (kpis.revenue > 0){
      d.push({ label:'Margem Líquida', value:fmtPct(kpis.netMargin), status: kpis.netMargin>=20?'good':kpis.netMargin>=5?'warn':'bad',
        detail: kpis.netMargin>=20 ? 'Margem excelente — negócio saudável.' : kpis.netMargin>=5 ? 'Margem aceitável, mas com pouca folga.' : 'Margem baixa — pouco espaço para imprevistos.' });
      d.push({ label:'Margem Bruta', value:fmtPct(kpis.grossMargin), status: kpis.grossMargin>=40?'good':kpis.grossMargin>=20?'warn':'bad',
        detail: kpis.grossMargin>=40 ? 'Boa margem antes dos custos fixos.' : kpis.grossMargin>=20 ? 'Margem mediana — vale revisar custo direto.' : 'Margem baixa — reveja custos variáveis ou preço.' });
    }
    if (kpis.roas !== null) d.push({ label:'ROAS', value: fmtNum(kpis.roas,2)+'x', status: kpis.roas>=4?'good':kpis.roas>=2?'warn':'bad',
      detail: kpis.roas>=4 ? 'Retorno forte sobre o investimento em anúncios.' : kpis.roas>=2 ? 'Retorno mediano — dá para otimizar.' : 'Retorno fraco — revise campanhas.' });
    if (kpis.cac !== null) d.push({ label:'CAC', value: fmtBRL(kpis.cac), status:'neutral', detail:'Custo para adquirir cada novo cliente.' });
    if (kpis.convRate !== null) d.push({ label:'Taxa de Conversão', value: fmtPct(kpis.convRate), status: kpis.convRate>=3?'good':kpis.convRate>=1?'warn':'bad',
      detail: kpis.convRate>=3 ? 'Boa conversão de leads em clientes.' : kpis.convRate>=1 ? 'Conversão mediana — reveja o funil.' : 'Conversão baixa — priorize o processo comercial.' });
    return d;
  }

  function computeSuggestions(kpis, month){
    var s = [];
    if (kpis.netProfit < 0) s.push({ priority:'urgente', action:'Cortar custos imediatamente', detail:'O negócio está no vermelho. Revise custos fixos e variáveis, e pause investimentos que não têm retorno claro este mês.' });
    if (kpis.revenue>0 && kpis.netMargin>=0 && kpis.netMargin<15) s.push({ priority:'alta', action:'Revisar precificação', detail:'Sua margem está apertada. Um ajuste de 10-15% no preço pode dobrar o lucro sem perder muito volume.' });
    if (kpis.roas !== null && kpis.roas < 3) s.push({ priority:'alta', action:'Otimizar campanhas de anúncios', detail:'O retorno dos anúncios está abaixo do ideal. Revise segmentação, criativos e páginas de destino antes de investir mais.' });
    if (kpis.roas !== null && kpis.roas >= 4) s.push({ priority:'oportunidade', action:'Escalar tráfego pago', detail:'Suas campanhas estão performando bem. Considere aumentar o investimento gradualmente para crescer o faturamento.' });
    if (kpis.convRate !== null && kpis.convRate < 2) s.push({ priority:'alta', action:'Revisar processo de vendas', detail:'Poucos leads estão virando clientes. Reveja abordagem comercial, tempo de resposta e follow-up.' });
    if (kpis.netMargin >= 25) s.push({ priority:'oportunidade', action:'Reinvestir para crescer', detail:'Margem saudável este mês. É um bom momento para investir em equipe, marketing ou novos produtos.' });
    if (!kpis.hasAds && kpis.mktSpend === 0 && kpis.revenue > 0) s.push({ priority:'media', action:'Considere investir em aquisição de clientes', detail:'Você não investiu em marketing este mês. Testar um orçamento pequeno em anúncios pode ajudar a crescer com previsibilidade.' });
    return s;
  }

      var data = (snap && snap.exists && snap.exists()) ? snap.data() : null;
      state.profile = Object.assign(emptyProfile(), data||{});
      state.profileLoaded = true;
      renderAll();
    }, function(){ state.profileLoaded = true; renderAll(); }));

    unsubscribers.push(onSnapshot(collection(db,'biz_months'), function(snap){
      var months = {};
      snap.docs.forEach(function(d){ var data = d.data()||{}; data.id = d.id; months[d.id] = data; });
      state.months = months;
      renderAll();
    }, function(){}));

    unsubscribers.push(onSnapshot(collection(db,'biz_records'), function(snap){
      state.records = snap.docs.map(function(d){ var data = d.data()||{}; data.id = d.id; return data; });
      renderAll();
    }, function(){}));

  function loginErrorMessage(code){
    if (code === 'auth/invalid-email') return 'E-mail inválido.';
    if (code === 'auth/user-disabled') return 'Esta conta foi desativada.';
    if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return 'E-mail ou senha incorretos.';
    if (code === 'auth/too-many-requests') return 'Muitas tentativas — aguarde um pouco e tente de novo.';
    return 'Não foi possível entrar. Tente novamente.';
  }
  function handleLogin(e){
    e.preventDefault();
    var email = $('loginEmail').value.trim();
    var pass = $('loginPassword').value;
    var errBox = $('loginError'); errBox.hidden = true;
    var btn = $('loginSubmit'); btn.disabled = true; btn.textContent = 'Entrando…';
    signInWithEmailAndPassword(auth, email, pass).catch(function(err){
      errBox.textContent = loginErrorMessage(err && err.code);
      errBox.hidden = false;
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Entrar no Heryn Business';
    });
  }
  function handleLogout(){ stopSync(); signOut(auth); }

  function updateWhoUI(){
    $('whoAvatarSlot').innerHTML = avatarHTML(state.viewerName, 24);
    $('whoName').textContent = state.viewerName || '';
  }

  function wireGlobal(){
    $('loginForm').addEventListener('submit', handleLogin);
    $('logoutBtn').addEventListener('click', handleLogout);
    $('themeToggle').addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      applyTheme(cur === 'light' ? 'dark' : 'light');
    });
    $('monthPrev').addEventListener('click', function(){ state.currentYM = shiftYM(state.currentYM, -1); renderAll(); });
    $('monthNext').addEventListener('click', function(){
      if (state.currentYM >= todayYM()) return;
      state.currentYM = shiftYM(state.currentYM, 1); renderAll();
    });
    $('exportBtn').addEventListener('click', exportMonthReport);
  }

  function boot(){
    initTheme();
    wireGlobal();
    onAuthStateChanged(auth, function(user){
      if (user){
        state.viewerName = nameForEmail(user.email);
        updateWhoUI();
        showApp();
        startSync();
      } else {
        state.viewerName = null;
        stopSync();
        showLogin();
      }
    });
  }

  function scoreRingSVG(score, color){
    var size = 72, stroke = 7, r = (size-stroke)/2, c = 2*Math.PI*r;
    var offset = c - (score/100)*c;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg);">' +
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"></circle>' +
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" ' +
      'stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" style="transition:stroke-dashoffset .5s;"></circle>' +
      '</svg>';
  }

  function kpiCard(label, value, sub, tone){
    return '<div class="kpi-card'+(tone?' '+tone:'')+'"><div class="kpi-label">'+esc(label)+'</div><div class="kpi-value">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';
  }

  function renderDashboard(){
    var box = $('screen-dashboard');

    if (!kpis){ box.innerHTML = ''; return; }
    var health = computeHealth(kpis, month);
    var msg = jarvisMessage(kpis, health, month, state.profile);
    var alerts = computeAlerts(kpis);
    var diagnostics = computeDiagnostics(kpis);
    var suggestions = computeSuggestions(kpis, month);

    var html = '';
    html += '<div class="jarvis-card">';
    html += '<div class="jarvis-ring" style="position:relative;">'+scoreRingSVG(health.score, health.color)+
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:20px;">'+health.score+'</div></div>';
    html += '<div class="jarvis-body"><div class="jarvis-eyebrow"><span class="eyebrow"><span class="dot"></span>Heryn Business</span><span class="badge badge-accent">'+esc(health.label)+'</span></div>';
    html += '<p class="jarvis-msg">'+esc(msg)+'</p>';
    if (kpis.revenue === 0){
      html += '<button class="btn btn-primary" id="jarvisGoInput" style="margin-top:10px;">Inserir dados do mês →</button>';
    }
    html += '</div></div>';

    html += '<div class="kpi-grid">';
    html += kpiCard('Faturamento', fmtBRL(kpis.revenue), kpis.revenue===0?'—':'Margem bruta: '+fmtPct(kpis.grossMargin));
    html += kpiCard('Lucro Líquido', fmtBRL(kpis.netProfit), fmtPct(kpis.netMargin)+' do faturamento', kpis.netProfit>=0?'good':'bad');
    html += kpiCard('Custo Fixo Total', fmtBRL(kpis.fixedTotal), 'Folha + Aluguel + Ferramentas');
    html += kpiCard('Invest. Marketing', fmtBRL(kpis.mktSpend), kpis.roas!==null ? 'ROAS: '+fmtNum(kpis.roas,2)+'x' : 'Sem tráfego pago');
    html += kpiCard('CAC', kpis.cac!==null?fmtBRL(kpis.cac):'—', kpis.newClients ? kpis.newClients+' novos clientes' : 'Sem dados');
    html += kpiCard('Tx. Conversão', kpis.convRate!==null?fmtPct(kpis.convRate):'—', kpis.leads ? kpis.leads+' leads' : 'Sem dados');
    html += kpiCard('Break-even', kpis.breakEven!==null?fmtBRL(kpis.breakEven):'—', kpis.breakEvenPct!==null ? fmtNum(kpis.breakEvenPct,0)+'% atingido' : '');
    var roasTone = kpis.roas===null ? '' : (kpis.roas>=3?'good':(kpis.roas>=1.5?'warn':'bad'));
    html += kpiCard('ROAS', kpis.roas!==null?fmtNum(kpis.roas,2)+'x':'—', kpis.mktSpend ? 'Invest: '+fmtBRL(kpis.mktSpend) : 'Sem anúncios', roasTone);
    html += '</div>';

    html += '<div class="grid-2">';
    html += '<div class="card-box"><h3 style="margin-top:0;">Alertas</h3>';
    if (!alerts.length){
      html += '<div class="alert-item"><span class="alert-icon" style="color:var(--good);">✓</span><div><div class="alert-title">Nenhum alerta crítico</div></div></div>';
    } else {
      html += alerts.map(function(a){
        return '<div class="alert-item"><span class="alert-icon">'+(a.level==='critical'?'⊗':'⚠')+'</span><div><div class="alert-title">'+esc(a.title)+'</div><div class="alert-body">'+esc(a.body)+'</div></div></div>';
      }).join('');
    }
    html += '</div>';
    html += '<div class="card-box"><h3 style="margin-top:0;">Diagnóstico</h3>';
    if (!diagnostics.length){
      html += '<div class="empty-tip">Insira dados para ver o diagnóstico.</div>';
    } else {
      html += diagnostics.map(function(d){
        var color = d.status==='good'?'var(--good)':d.status==='warn'?'var(--warn)':d.status==='bad'?'var(--bad)':'var(--ink-muted)';
        return '<div class="diag-row"><span class="diag-dot" style="background:'+color+';"></span><div style="flex:1;"><div class="diag-label">'+esc(d.label)+'</div><div class="diag-value" style="color:'+color+';">'+d.value+'</div><div class="alert-body">'+esc(d.detail)+'</div></div></div>';
      }).join('');
    }
    html += '</div></div>';

    if (suggestions.length){
      var prioMap = { urgente:'badge-bad', alta:'badge-warn', oportunidade:'badge-accent', media:'badge-neutral' };
      html += '<div class="card-box" style="margin-top:16px;"><h3 style="margin-top:0;">Plano de Ação</h3>';
      html += suggestions.map(function(s, i){
        return '<div class="sugg-item"><span class="sugg-idx">'+(i+1)+'</span><div style="flex:1;"><div class="sugg-head"><b>'+esc(s.action)+'</b><span class="badge '+prioMap[s.priority]+'">'+esc(s.priority)+'</span></div><div class="alert-body">'+esc(s.detail)+'</div></div></div>';
      }).join('');
      html += '</div>';
    }

    box.innerHTML = html;
    var goBtn = $('jarvisGoInput');
    if (goBtn) goBtn.addEventListener('click', function(){ switchView('input'); });
  }

  // ============================================================
  // Orçamento por Setor
  // ============================================================
  function renderBudget(){
    var box = $('screen-budget');
    var m = getCurrentMonth();
    var budgets = SECTORS.map(function(s){
      var found = (m.budgets||[]).filter(function(b){ return b.sector===s; })[0];
      return found || { sector:s, allocated:'', spent:'' };
    });
    var totalAlloc = budgets.reduce(function(a,b){ return a+(Number(b.allocated)||0); },0);
    var totalSpent = budgets.reduce(function(a,b){ return a+(Number(b.spent)||0); },0);

    var html = '<div class="grid-3" style="margin-bottom:16px;">';
    html += kpiCard('Total Orçado', fmtBRL(totalAlloc));
    html += kpiCard('Total Gasto', fmtBRL(totalSpent), '', (totalSpent>totalAlloc && totalAlloc>0)?'bad':'good');
    html += kpiCard('Utilizado', totalAlloc>0 ? fmtPct((totalSpent/totalAlloc)*100,0) : '—');
    html += '</div>';

    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Setor</th><th>Orçado (R$)</th><th>Gasto (R$)</th><th>Status</th></tr></thead><tbody>';
    budgets.forEach(function(b, idx){
      var pct = Number(b.allocated)>0 ? (Number(b.spent)/Number(b.allocated))*100 : 0;
      var statusHtml = Number(b.allocated)===0 ? '<span class="badge badge-neutral">—</span>' :
        (Number(b.spent) > Number(b.allocated)) ? '<span class="badge badge-bad">Estourou '+fmtNum(pct,0)+'%</span>' :
        '<span class="badge badge-good">'+fmtNum(pct,0)+'% usado</span>';
      html += '<tr><td>'+esc(b.sector)+'</td>' +
        '<td><input class="cell-input" type="number" step="any" data-alloc="'+idx+'" value="'+esc(b.allocated)+'"></td>' +
        '<td><input class="cell-input" type="number" step="any" data-spent="'+idx+'" value="'+esc(b.spent)+'"></td>' +
        '<td>'+statusHtml+'</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="hint" style="margin-top:10px;">Configure orçamentos apenas para os setores que você usa. Setores em branco são ignorados na análise.</div>';

    box.innerHTML = html;
    box.querySelectorAll('[data-alloc]').forEach(function(el){
      el.addEventListener('change', function(){
        budgets[+el.dataset.alloc].allocated = el.value;
        saveMonthField({ budgets: budgets });
      });
    });
    box.querySelectorAll('[data-spent]').forEach(function(el){
      el.addEventListener('change', function(){
        budgets[+el.dataset.spent].spent = el.value;
        saveMonthField({ budgets: budgets });
      });
    });
  }

  // ============================================================
  // Metas do Mês
  // ============================================================
  function goalCard(icon, label, goalKey, actual, goals, isCurrency){
    var goalVal = Number(goals[goalKey])||0;
    var pct = goalVal>0 ? Math.min(100, (actual/goalVal)*100) : null;
    var barColor = pct===null ? 'var(--ink-muted)' : (pct>=100?'var(--good)':pct>=70?'var(--warn)':'var(--accent)');
    var actualFmt = isCurrency ? fmtBRL(actual) : Math.round(actual);
    var html = '<div class="card-box"><h3 style="margin-top:0;">'+icon+' '+esc(label)+'</h3>';
    html += '<div class="field-row" style="align-items:center;"><div class="field" style="flex:1;"><label>Meta</label>' +
      '<input class="input" type="number" step="any" data-goal="'+goalKey+'" value="'+esc(goals[goalKey])+'"></div></div>';
    if (goalVal>0){
      html += '<div class="progress-bar" style="margin:10px 0 6px;"><div class="progress-fill" style="width:'+pct.toFixed(1)+'%;background:'+barColor+';"></div></div>';
      html += '<div style="font-size:12.5px;color:var(--ink-muted);">Realizado: <b style="color:var(--ink);">'+actualFmt+'</b></div>';
      if (pct>=100) html += '<div style="color:var(--good);font-weight:700;font-size:13px;margin-top:4px;">✓ Meta atingida!</div>';
      else if (actual>0) html += '<div style="color:var(--ink-muted);font-size:12.5px;margin-top:4px;">Falta '+(isCurrency?fmtBRL(goalVal-actual):Math.round(goalVal-actual))+' para bater a meta</div>';
    } else {
      html += '<div style="font-size:12.5px;color:var(--ink-muted);margin-top:6px;">Realizado: <b style="color:var(--ink);">'+actualFmt+'</b> · Progresso: —</div>';
    }
    html += '</div>';
    return html;
  }

  // ============================================================
  // Funil de Vendas
  // ============================================================
  function renderFunnel(){
    var box = $('screen-funnel');
    var m = getCurrentMonth();
    var funnel = Object.assign({}, m.funnel||{});
    var stageVals = FUNNEL_STAGES.map(function(st){ return Number(funnel[st.id])||0; });
    var maxVal = Math.max.apply(null, stageVals.concat([1]));

    var html = '<div class="grid-2">';
    html += '<div class="card-box"><h3 style="margin-top:0;">Dados do Funil</h3>';
    html += FUNNEL_STAGES.map(function(st){
      return '<div class="field"><label>'+st.icon+' '+esc(st.label)+'</label><span class="hint">'+esc(st.hint)+'</span>' +
        '<input class="input" type="number" step="any" data-stage="'+st.id+'" value="'+esc(funnel[st.id]||'')+'" placeholder="#0"></div>';
    }).join('');
    html += '</div>';

    html += '<div class="card-box"><h3 style="margin-top:0;">Visualização</h3>';
    FUNNEL_STAGES.forEach(function(st, i){
      var val = stageVals[i];
      var widthPct = maxVal>0 ? (val/maxVal)*100 : 0;
      html += '<div class="funnel-row"><div class="funnel-label"><span>'+st.icon+' '+esc(st.label)+'</span><span>'+(val?val.toLocaleString('pt-BR'):'0')+'</span></div>';
      html += '<div class="funnel-track"><div class="funnel-fill" style="width:'+Math.max(widthPct,2)+'%;background:'+FUNNEL_COLORS[i]+';"></div></div>';
      if (i>0 && val>0 && stageVals[i-1]>0){
        var stepPct = (val/stageVals[i-1])*100;
        html += '<div class="funnel-step">'+fmtNum(stepPct,1)+'% do passo anterior</div>';
      }
      html += '</div>';
    });
    var impressions = stageVals[0], sales = stageVals[4];
    if (impressions>0 && sales>0){
      html += '<div class="hint" style="margin-top:8px;">Conversão total do funil: <b style="color:var(--ink);">'+fmtNum((sales/impressions)*100,2)+'%</b></div>';
    }
    html += '</div></div>';

    box.innerHTML = html;
    box.querySelectorAll('[data-stage]').forEach(function(el){
      el.addEventListener('change', function(){
        funnel[el.dataset.stage] = el.value;
        saveMonthField({ funnel: funnel });
      });
    });
  }

      html += '<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Valor</th><th>Segmento</th><th>Status</th><th></th></tr></thead><tbody>';
      clients.forEach(function(c){
        html += '<tr><td>'+esc(c.name)+'</td><td>'+fmtBRL(c.value)+'</td><td>'+esc(c.segment||'—')+'</td>' +
          '<td><span class="badge '+(statusBadge[c.status]||'badge-neutral')+'">'+esc(c.status)+'</span></td>' +
          '<td><button class="row-del" data-delclient="'+c.id+'" title="Excluir">🗑</button></td></tr>';

      html += '</tbody></table></div>';

      renderClients();

    var save = $('cfSave');
    if (save) save.addEventListener('click', function(){
      var d = clientFormDraft;
      d.name = $('cfName').value; d.value = $('cfValue').value; d.status = $('cfStatus').value; d.segment = $('cfSegment').value;
      if (!d.name.trim()) return;
      var newClients = clients.concat([Object.assign({}, d, { id: Date.now() })]);
      saveMonthField({ clients: newClients });
      clientFormOpen = false; clientFormDraft = null;

    var cancel = $('cfCancel');
    if (cancel) cancel.addEventListener('click', function(){ clientFormOpen = false; clientFormDraft = null; renderClients(); });
    box.querySelectorAll('[data-delclient]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.delclient;

        saveMonthField({ clients: newClients });
      });
    });
  }

  // ============================================================
  // Break-even (Ponto de Equilíbrio)

  var breakevenSim = { revenue:'', varPct:'' };
  function renderBreakeven(){
    var box = $('screen-breakeven');
    var m = getCurrentMonth();
    var kpis = calcKPIs(m, state.profile);
    if (!kpis){ box.innerHTML = ''; return; }

    var html = '<div class="grid-3" style="margin-bottom:16px;">';
    html += kpiCard('Custos Fixos Totais', fmtBRL(kpis.fixedTotal));
    html += kpiCard('Margem Bruta Atual', fmtPct(kpis.grossMargin));
    var beTone = kpis.breakEven===null ? '' : (kpis.revenue >= kpis.breakEven ? 'good' : 'bad');
    html += kpiCard('Break-even Calculado', kpis.breakEven!==null?fmtBRL(kpis.breakEven):'—', '', beTone);
    html += '</div>';

    if (kpis.breakEven && kpis.revenue>0){
      var pct = Math.min(100, (kpis.revenue/kpis.breakEven)*100);
      html += '<div class="card-box" style="margin-bottom:16px;"><h3 style="margin-top:0;">Progresso para o break-even</h3>' +
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-muted);margin-bottom:6px;"><span>'+fmtBRL(kpis.revenue)+'</span><span>'+fmtBRL(kpis.breakEven)+'</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+(kpis.revenue>=kpis.breakEven?'var(--good)':'var(--warn)')+';"></div></div>';
      if (kpis.revenue < kpis.breakEven) html += '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-muted);">Faltam '+fmtBRL(kpis.breakEven-kpis.revenue)+' para cobrir todos os custos.</div>';
      else html += '<div style="margin-top:8px;font-size:13px;color:var(--good);font-weight:700;">✓ Passado o break-even! Lucro de '+fmtBRL(kpis.netProfit)+'.</div>';
      html += '</div>';
    }

    var simRevenue = Number(breakevenSim.revenue) || kpis.revenue;
    var varRatio = breakevenSim.varPct !== '' ? Number(breakevenSim.varPct)/100 : (kpis.revenue>0 ? kpis.varCosts/kpis.revenue : 0);
    var grossMarginRatio = 1 - varRatio;
    var beSim = grossMarginRatio>0 ? (kpis.fixedTotal + kpis.mktSpend)/grossMarginRatio : 0;
    var profitSim = simRevenue*grossMarginRatio - kpis.fixedTotal - kpis.mktSpend;

    html += '<div class="card-box"><h3 style="margin-top:0;">Simulador de Break-even</h3><div class="field-row">' +
      '<div class="field"><label>Faturamento Simulado</label><input class="input" type="number" step="any" id="beRevenue" placeholder="'+fmtNum(kpis.revenue,0)+'" value="'+esc(breakevenSim.revenue)+'"></div>' +
      '<div class="field"><label>% Custo Variável Simulado</label><span class="hint">Ex: 30 = 30% do faturamento vai para custo variável</span>' +
      '<input class="input" type="number" step="any" id="beVarPct" placeholder="'+fmtNum(varRatio*100,0)+'" value="'+esc(breakevenSim.varPct)+'"></div></div>';
    if (beSim>0){
      html += '<div class="grid-3" style="margin-top:8px;">';
      html += kpiCard('Break-even simulado', fmtBRL(beSim));
      html += kpiCard('Lucro simulado', fmtBRL(profitSim), '', profitSim>=0?'good':'bad');
      html += kpiCard('Margem bruta simulada', fmtPct(grossMarginRatio*100));
      html += '</div>';
    }
    html += '</div>';

    box.innerHTML = html;
    $('beRevenue').addEventListener('input', function(){ breakevenSim.revenue = this.value; rerenderPreserveFocus(renderBreakeven); });
    $('beVarPct').addEventListener('input', function(){ breakevenSim.varPct = this.value; rerenderPreserveFocus(renderBreakeven); });
  }

  // ============================================================
  // Simulador "E Se...?"
  // ============================================================
  var simDelta = { revenue:'', varCosts:'', mktSpend:'', adRevenue:'' };
  function renderSimulator(){
    var box = $('screen-simulator');
    var m = getCurrentMonth();
    var current = calcKPIs(m, state.profile);
    if (!current){ box.innerHTML = '<div class="empty-tip">Insira os dados reais do mês primeiro para ativar o simulador.</div>'; return; }
    var currentHealth = computeHealth(current, m);

    var simulatedMonth = Object.assign({}, m, {
      revenue: (Number(m.revenue)||0) + (Number(simDelta.revenue)||0),
      varCosts: (Number(m.varCosts)||0) + (Number(simDelta.varCosts)||0),
      mktSpend: (Number(m.mktSpend)||0) + (Number(simDelta.mktSpend)||0),
      adRevenue: (Number(m.adRevenue)||0) + (Number(simDelta.adRevenue)||0)
    });
    var sim = calcKPIs(simulatedMonth, state.profile);
    var simHealth = computeHealth(sim, simulatedMonth);

    function cmpRow(label, curVal, simVal, fmt){
      var delta = simVal - curVal;
      var up = delta > 0.0001, down = delta < -0.0001;
      var arrow = up ? '<span style="color:var(--good);">↑</span>' : down ? '<span style="color:var(--bad);">↓</span>' : '';
      return '<tr><td>'+label+'</td><td class="mono">'+fmt(curVal)+'</td><td class="mono">'+fmt(simVal)+'</td><td class="mono">'+arrow+'</td></tr>';
    }
    var html = '<div class="grid-2">';
    html += '<div class="card-box"><h3 style="margin-top:0;">Ajuste os valores (+/-)</h3>' +
      '<div class="field"><label>Variação no Faturamento</label><span class="hint">Positivo = mais receita, negativo = menos</span><input class="input" type="number" step="any" id="sdRevenue" placeholder="0 (sem variação)" value="'+esc(simDelta.revenue)+'"></div>' +
      '<div class="field"><label>Variação no Custo Variável</label><span class="hint">Positivo = mais caro, negativo = mais barato</span><input class="input" type="number" step="any" id="sdVarCosts" placeholder="0 (sem variação)" value="'+esc(simDelta.varCosts)+'"></div>' +
      '<div class="field"><label>Variação em Marketing</label><input class="input" type="number" step="any" id="sdMktSpend" placeholder="0 (sem variação)" value="'+esc(simDelta.mktSpend)+'"></div>' +
      '<div class="field"><label>Variação na Receita de Ads</label><input class="input" type="number" step="any" id="sdAdRevenue" placeholder="0 (sem variação)" value="'+esc(simDelta.adRevenue)+'"></div>' +
      '<button class="btn btn-ghost" id="sdReset" type="button">Resetar</button></div>';

    html += '<div class="card-box"><h3 style="margin-top:0;">Resultado Simulado</h3><table class="table"><thead><tr><th></th><th>Atual</th><th>Simulado</th><th></th></tr></thead><tbody>';
    html += cmpRow('Faturamento', current.revenue, sim.revenue, fmtBRL);
    html += cmpRow('Lucro Líquido', current.netProfit, sim.netProfit, fmtBRL);
    html += cmpRow('Margem Líquida', current.netMargin, sim.netMargin, function(v){return fmtPct(v);});
    html += cmpRow('Margem Bruta', current.grossMargin, sim.grossMargin, function(v){return fmtPct(v);});
    html += cmpRow('ROAS', current.roas||0, sim.roas||0, function(v){return v?fmtNum(v,2)+'x':'—';});
    html += '</tbody></table>';
    var improved = simHealth.score >= currentHealth.score;
    html += '<div class="card-box" style="margin-top:12px;background:'+(improved?'var(--good-bg)':'var(--bad-bg)')+';border-color:transparent;">' +
      'Saúde simulada: <b>'+simHealth.score+' — '+simHealth.label+'</b> <span class="hint">(atual: '+currentHealth.score+')</span></div>';
    html += '</div></div>';

    box.innerHTML = html;
    [['sdRevenue','revenue'],['sdVarCosts','varCosts'],['sdMktSpend','mktSpend'],['sdAdRevenue','adRevenue']].forEach(function(pair){
      $(pair[0]).addEventListener('input', function(){ simDelta[pair[1]] = this.value; rerenderPreserveFocus(renderSimulator); });
    });
    $('sdReset').addEventListener('click', function(){ simDelta = { revenue:'', varCosts:'', mktSpend:'', adRevenue:'' }; renderSimulator(); });
  }

  // ============================================================
  // Precificação Inteligente
  // ============================================================
  var pricingState = { cost:'', margin:'30', qty:'1', price:'' };
  function renderPricing(){
    var box = $('screen-pricing');
    var r = Number(pricingState.cost)||0;
    var l = Number(pricingState.margin)||30;
    var o = Number(pricingState.qty)||1;
    var idealPrice = (r>0 && l<100) ? r/(1-l/100) : 0;
    var currentPrice = Number(pricingState.price)||0;
    var realMarginPct = (currentPrice>0 && r>0) ? ((currentPrice-r)/currentPrice)*100 : 0;

    var html = '<div class="grid-2">';
    html += '<div class="card-box"><h3 style="margin-top:0;">Parâmetros</h3>' +
      '<div class="field"><label>Custo do Produto / Serviço</label><span class="hint">Quanto custa para você entregar</span><input class="input" type="number" step="any" id="prCost" value="'+esc(pricingState.cost)+'"></div>' +
      '<div class="field"><label>Margem Desejada (%)</label><span class="hint">Percentual de lucro sobre o preço de venda</span><input class="input" type="number" step="any" id="prMargin" placeholder="30" value="'+esc(pricingState.margin)+'"></div>' +
      '<div class="field"><label>Quantidade Vendida por Mês</label><span class="hint">Volume mensal estimado</span><input class="input" type="number" step="any" id="prQty" placeholder="1" value="'+esc(pricingState.qty)+'"></div>' +
      '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">' +
      '<div class="field"><label>Ou informe o preço atual</label><span class="hint">Para calcular a margem real</span><input class="input" type="number" step="any" id="prPrice" value="'+esc(pricingState.price)+'"></div>' +
      '</div>';

    html += '<div class="card-box"><h3 style="margin-top:0;">Resultado</h3>';
    if (idealPrice>0){
      html += '<div class="card-box" style="background:var(--info-bg);border-color:transparent;margin-bottom:10px;">' +
        '<div class="kpi-label">Preço ideal para '+fmtNum(l,0)+'% de margem</div><div class="kpi-value" style="color:var(--gold-300);">'+fmtBRL(idealPrice)+'</div>' +
        '<div class="kpi-sub" style="color:var(--good);">Lucro por unidade: '+fmtBRL(idealPrice-r)+'</div></div>';
    }
    if (currentPrice>0 && r>0){
      var mColor = realMarginPct>=20?'var(--good)':realMarginPct>=10?'var(--warn)':'var(--bad)';
      var caption = realMarginPct>=20 ? '✅ Boa margem' : realMarginPct>=10 ? '⚠️ Margem aceitável' : '🚨 Margem perigosa — revise o preço';
      html += '<div class="card-box" style="margin-bottom:10px;"><div class="kpi-label">Margem real do preço informado</div>' +
        '<div class="kpi-value" style="color:'+mColor+';">'+fmtPct(realMarginPct)+'</div><div class="kpi-sub">'+caption+'</div></div>';
    }
    if (idealPrice>0 && o>1){
      html += '<div class="card-box"><div class="kpi-label">Faturamento mensal estimado ('+o+'x)</div><div class="kpi-value">'+fmtBRL(idealPrice*o)+'</div></div>';
    }
    html += '</div></div>';

    if (r>0){
      html += '<div class="card-box" style="margin-top:16px;"><h3 style="margin-top:0;">Tabela de Margens</h3>' +
        '<div class="table-wrap"><table class="table"><thead><tr><th>Margem</th><th>Preço de Venda</th><th>Lucro por Unidade</th><th>Faturamento/mês</th></tr></thead><tbody>';
      [10,20,30,40,50,60].forEach(function(marginPct){
        var priceAtMargin = r/(1-marginPct/100);
        var rowStyle = Math.round(l) === marginPct ? ' style="background:var(--surface-2);"' : '';
        var badge = marginPct>=30 ? 'badge-good' : marginPct>=20 ? 'badge-warn' : 'badge-bad';
        html += '<tr'+rowStyle+'><td><span class="badge '+badge+'">'+marginPct+'%</span></td><td>'+fmtBRL(priceAtMargin)+'</td>' +
          '<td style="color:var(--good);">'+fmtBRL(priceAtMargin-r)+'</td><td>'+fmtBRL(priceAtMargin*o)+'</td></tr>';
      });
      html += '</tbody></table></div></div>';
    }
    if (r===0){
      html += '<div class="empty-tip" style="margin-top:16px;">Informe o custo do produto ou serviço para ver os resultados.</div>';
    }

    box.innerHTML = html;
    [['prCost','cost'],['prMargin','margin'],['prQty','qty'],['prPrice','price']].forEach(function(pair){
      $(pair[0]).addEventListener('input', function(){ pricingState[pair[1]] = this.value; rerenderPreserveFocus(renderPricing); });
    });
  }


  // ============================================================
  // Meus Registros
  // ============================================================
  var recordFormOpen = false;
  var recordFormDraft = null;
  var recordFilterType = '';
  var recordFilterCategory = '';
  function fmtDateBR(iso){
    if (!iso) return '—';
    var p = iso.split('-'); return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso;
  }
  function renderRecords(){
    var box = $('screen-records');
    var html = '<div class="toolbar-row" style="display:flex;justify-content:flex-end;margin-bottom:14px;">' +
      '<button class="btn btn-primary" id="newRecordBtn" type="button">+ Novo Registro</button></div>';

    if (recordFormOpen){
      var d = recordFormDraft;
      html += '<div class="card-box" style="margin-bottom:16px;"><h3 style="margin-top:0;">Novo Registro</h3>' +
        '<div class="field-row"><div class="field"><label>Data</label><input class="input" id="rfDate" type="date" value="'+esc(d.date)+'"></div>' +
        '<div class="field"><label>Valor</label><input class="input" id="rfValue" type="number" step="any" value="'+esc(d.value)+'"></div></div>' +
        '<div class="field"><label>Descrição</label><input class="input" id="rfDesc" placeholder="Ex: Assinatura Canva" value="'+esc(d.description)+'"></div>' +
        '<div class="field-row"><div class="field"><label>Categoria</label><select class="select" id="rfCategory">'+RECORD_CATEGORIES.map(function(c){ return '<option value="'+c+'"'+(c===d.category?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>' +
        '<div class="field"><label>Tipo</label><select class="select" id="rfType"><option value="saida"'+(d.type==='saida'?' selected':'')+'>Saída</option><option value="entrada"'+(d.type==='entrada'?' selected':'')+'>Entrada</option></select></div></div>' +
        '<div style="display:flex;gap:10px;"><button class="btn btn-primary" id="rfSave" type="button">Salvar Registro</button><button class="btn btn-ghost" id="rfCancel" type="button">Cancelar</button></div>' +
        '</div>';
    }

    var list = state.records.filter(function(r){
      if (recordFilterType && r.type !== recordFilterType) return false;
      if (recordFilterCategory && r.category !== recordFilterCategory) return false;
      return true;
    }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    if (state.records.length){
      var entradas = list.reduce(function(a,r){ return r.type==='entrada' ? a+(Number(r.value)||0) : a; },0);
      var saidas = list.reduce(function(a,r){ return r.type==='saida' ? a+(Number(r.value)||0) : a; },0);
      html += '<div class="grid-3" style="margin-bottom:14px;">';
      html += kpiCard('Entradas', fmtBRL(entradas), '', 'good');
      html += kpiCard('Saídas', fmtBRL(saidas), '', 'bad');
      html += kpiCard('Saldo', fmtBRL(entradas-saidas), '', (entradas-saidas)>=0?'good':'bad');
      html += '</div>';

      html += '<div class="field-row" style="margin-bottom:12px;">' +
        '<select class="select" id="recFilterType" style="max-width:180px;"><option value="">Todos os tipos</option><option value="entrada"'+(recordFilterType==='entrada'?' selected':'')+'>Entrada</option><option value="saida"'+(recordFilterType==='saida'?' selected':'')+'>Saída</option></select>' +
        '<select class="select" id="recFilterCat" style="max-width:200px;"><option value="">Todas as categorias</option>'+RECORD_CATEGORIES.map(function(c){ return '<option value="'+c+'"'+(c===recordFilterCategory?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>';
    }

    if (list.length){
      html += '<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>';
      list.forEach(function(r){
        html += '<tr><td class="mono">'+fmtDateBR(r.date)+'</td><td>'+esc(r.description)+'</td>' +
          '<td><span class="badge badge-neutral">'+esc(r.category)+'</span></td>' +
          '<td><span class="badge '+(r.type==='entrada'?'badge-good':'badge-warn')+'">'+(r.type==='entrada'?'Entrada':'Saída')+'</span></td>' +
          '<td style="color:'+(r.type==='entrada'?'var(--good)':'var(--bad)')+';font-weight:700;">'+fmtBRL(r.value)+'</td>' +
          '<td><button class="row-del" data-delrec="'+r.id+'" title="Excluir">🗑</button></td></tr>';
      });
      html += '</tbody></table></div>';
    } else if (!recordFormOpen){
      html += '<div class="empty-tip">Nenhum registro encontrado. Clique em <b>Novo Registro</b> para adicionar.</div>';
    }

    box.innerHTML = html;
    var newBtn = $('newRecordBtn');
    if (newBtn) newBtn.addEventListener('click', function(){
      recordFormOpen = true; recordFormDraft = emptyRecord(); renderRecords();
    });
    var save = $('rfSave');
    if (save) save.addEventListener('click', function(){
      var d = recordFormDraft;
      d.date = $('rfDate').value; d.value = $('rfValue').value; d.description = $('rfDesc').value;
      d.category = $('rfCategory').value; d.type = $('rfType').value;
      if (!d.description.trim() || !d.value) { toast('Preencha descrição e valor.'); return; }
      if (!db) return;
      addDoc(collection(db,'biz_records'), Object.assign({}, d, { createdAt: new Date().toISOString(), createdBy: state.viewerName||'Alguém' }))
        .then(function(){ toast('Registro adicionado.'); })
        .catch(function(){ toast('Não deu para salvar.'); });
      recordFormOpen = false; recordFormDraft = null;
    });
    var cancel = $('rfCancel');
    if (cancel) cancel.addEventListener('click', function(){ recordFormOpen = false; recordFormDraft = null; renderRecords(); });
    var ft = $('recFilterType'); if (ft) ft.addEventListener('change', function(){ recordFilterType = this.value; renderRecords(); });
    var fc = $('recFilterCat'); if (fc) fc.addEventListener('change', function(){ recordFilterCategory = this.value; renderRecords(); });
    box.querySelectorAll('[data-delrec]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (!db) return;
        deleteDoc(doc(db,'biz_records', btn.dataset.delrec)).catch(function(){ toast('Não deu para excluir.'); });
      });
    });
  }

  // ============================================================
  // Histórico
  // ============================================================
  function renderHistory(){
    var box = $('screen-history');
    var all = Object.keys(state.months).map(function(id){ return state.months[id]; })
      .filter(function(m){ var k = calcKPIs(m, state.profile); return k && k.revenue > 0; })
      .sort(function(a,b){ return b.id.localeCompare(a.id); })
      .slice(0,12);

    if (!all.length){
      box.innerHTML = '<div class="empty-tip">Nenhum mês com dados registrado ainda.</div>';
      return;
    }

    var chartMonths = all.slice(0,6).slice().reverse();
    var maxRevenue = Math.max.apply(null, chartMonths.map(function(m){ return calcKPIs(m, state.profile).revenue; }).concat([1]));

    var html = '<div class="card-box" style="margin-bottom:18px;"><h3 style="margin-top:0;">Faturamento Mensal</h3>' +
      '<div style="display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:20px;">';
    chartMonths.forEach(function(m){
      var k = calcKPIs(m, state.profile);
      var h = Math.max(10, (k.revenue/maxRevenue)*130);
      var isCurrent = m.id === state.currentYM;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;" data-gotomonth="'+m.id+'">' +
        '<div class="mono" style="font-size:10.5px;color:var(--ink-muted);">'+fmtBRL(k.revenue).replace(/\s/g,'')+'</div>' +
        '<div style="width:100%;max-width:46px;height:'+h+'px;border-radius:6px 6px 0 0;background:'+(isCurrent?'var(--accent)':'var(--surface-2)')+';"></div>' +
        '<div style="font-size:11px;color:var(--ink-muted);">'+monthNameShort(m.id)+'</div></div>';
    });
    html += '</div></div>';

    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Faturamento</th><th>Lucro Líquido</th><th>Margem</th><th>ROAS</th><th>Saúde</th><th></th></tr></thead><tbody>';
    all.forEach(function(m){
      var k = calcKPIs(m, state.profile);
      var h = computeHealth(k, m);
      var marginBadge = k.netMargin>=20?'badge-good':k.netMargin>=10?'badge-warn':'badge-bad';
      var rowStyle = m.id === state.currentYM ? ' style="background:var(--surface-2);"' : '';
      html += '<tr'+rowStyle+'><td>'+monthNameLong(m.id)+'</td><td>'+fmtBRL(k.revenue)+'</td>' +
        '<td style="color:'+(k.netProfit>=0?'var(--good)':'var(--bad)')+';">'+fmtBRL(k.netProfit)+'</td>' +
        '<td><span class="badge '+marginBadge+'">'+fmtPct(k.netMargin)+'</span></td>' +
        '<td>'+(k.roas!==null?fmtNum(k.roas,2)+'x':'—')+'</td>' +
        '<td style="color:'+h.color+';font-weight:700;">'+h.score+' — '+h.label+'</td>' +
        '<td><button class="btn btn-ghost btn-sm" data-gotomonth="'+m.id+'" type="button">Ver</button></td></tr>';
    });
    html += '</tbody></table></div>';

    box.innerHTML = html;
    box.querySelectorAll('[data-gotomonth]').forEach(function(el){
      el.addEventListener('click', function(){
        state.currentYM = el.dataset.gotomonth;
        switchView('dashboard');
      });
    });
  }

    var html = '<div class="stack">';
