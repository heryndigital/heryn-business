    html += '</div>';
    box.innerHTML = html;

    ['stOwnerName','stBusinessName','stFixedTeam','stFixedRent','stFixedTools','stFixedOther'].forEach(function(id){
      var key = id.replace('st','');
      key = key.charAt(0).toLowerCase()+key.slice(1);
      $(id).addEventListener('input', function(){ d[key] = this.value; });
    });
    $('stSegment').addEventListener('change', function(){ d.segment = this.value; });
    $('stSave').addEventListener('click', function(){
      saveProfile(d).then(function(){
        var ok = $('stSavedOk'); ok.style.opacity = '1';
        setTimeout(function(){ ok.style.opacity = '0'; }, 2000);
      }).catch(function(){ toast('Não deu para salvar.'); });
    });
    $('stWipe').addEventListener('click', function(){
      if (!confirm('Tem certeza? Todos os dados serão apagados.')) return;
      if (!db) return;
      var jobs = [ setDoc(doc(db,'biz_profile','main'), emptyProfile()) ];
      Object.keys(state.months).forEach(function(id){ jobs.push(deleteDoc(doc(db,'biz_months', id))); });
      state.records.forEach(function(r){ jobs.push(deleteDoc(doc(db,'biz_records', r.id))); });
      Promise.all(jobs).then(function(){ toast('Dados apagados.'); settingsDraft = null; }).catch(function(){ toast('Erro ao apagar alguns dados.'); });
    });
  }

  // ============================================================
  // Glossário Financeiro
  // ============================================================
  var GLOSSARY = [
    {icon:'📢', term:'ROAS', full:'Return on Ad Spend', what:'Quanto você recebe para cada real investido em anúncios.', why:'Mede se seus anúncios estão valendo a pena. Abaixo de 2x você pode estar desperdiçando dinheiro.', ideal:'Mínimo 3x. Excelente: 5x+. Abaixo de 2x: revisar urgente.'},
    {icon:'🎯', term:'CAC', full:'Custo de Aquisição de Cliente', what:'Quanto você gasta em marketing para conseguir um novo cliente.', why:'Se o CAC for maior que o lucro por cliente, você perde dinheiro a cada venda.', ideal:'Deve ser menor que 1/3 do valor total que o cliente gera (LTV).'},
    {icon:'💎', term:'LTV', full:'Lifetime Value', what:'O valor total que um cliente gera para seu negócio ao longo do tempo.', why:'Saber o LTV te ajuda a entender quanto você pode gastar para adquirir um cliente e ainda lucrar.', ideal:'Deve ser pelo menos 3x maior que o CAC.'},
    {icon:'📊', term:'Margem Bruta', full:'Margem Bruta', what:'Diferença entre faturamento e o custo de produzir/entregar seu produto ou serviço.', why:'Mostra se seu produto tem potencial de lucro antes dos custos fixos e marketing.', ideal:'Serviços: 60%+. Produtos: 40%+. Abaixo de 20%: revisar custos de entrega.'},
    {icon:'💰', term:'Margem Líquida', full:'Margem Líquida', what:'O lucro real após descontar TODOS os custos: produção, fixos e marketing.', why:'É o número mais importante. Mostra quanto do faturamento realmente fica no bolso.', ideal:'Acima de 20% é excelente. 10-20% é saudável. Abaixo de 5% é zona de risco.'},
    {icon:'⚖️', term:'Break-even', full:'Ponto de Equilíbrio', what:'O faturamento mínimo mensal para o negócio não ter prejuízo.', why:'Todo empresário precisa saber esse número. É a meta mínima do mês.', ideal:'Você deve faturar pelo menos 20-30% acima do break-even todo mês.'},
    {icon:'📈', term:'Funil de Vendas', full:'Funil de Vendas', what:'O caminho que um cliente percorre desde conhecer seu negócio até comprar.', why:'Mostra onde você está perdendo clientes. Muitos leads mas poucos compradores = problema no processo.', ideal:'Taxa de conversão lead → cliente: acima de 2% é bom. Acima de 5% é excelente.'},
    {icon:'🔄', term:'Taxa de Conversão', full:'Taxa de Conversão', what:'Porcentagem de leads (pessoas interessadas) que realmente compram de você.', why:'Aumentar a conversão em 1-2% pode dobrar o faturamento sem investir mais em marketing.', ideal:'Varia por setor: 1-3% para leads frios, 5-15% para leads quentes.'},
    {icon:'📌', term:'Custo Fixo', full:'Custo Fixo', what:'Gastos que você tem todo mês independente de vender ou não. Aluguel, salários, ferramentas.', why:'São os gastos que "correm" mesmo quando o mês é ruim. Controlá-los é vital.', ideal:'Não deve consumir mais de 30-40% do faturamento médio.'},
    {icon:'📦', term:'Custo Variável', full:'Custo Variável', what:'Gastos que crescem conforme você vende mais: matéria-prima, impostos sobre venda, comissões.', why:'Diferente dos fixos, esses só existem quando há venda. Importante calcular por unidade.', ideal:'Deve representar no máximo 40-60% do preço de venda, dependendo do setor.'},
    {icon:'💸', term:'Fluxo de Caixa', full:'Fluxo de Caixa', what:'Controle de todo dinheiro que entra e sai do negócio ao longo do tempo.', why:'Um negócio pode ser lucrativo no papel mas quebrar por falta de caixa. O fluxo previne isso.', ideal:'Ter sempre reserva de 3-6 meses de custos fixos em caixa.'},
    {icon:'🧾', term:'Ticket Médio', full:'Ticket Médio', what:'O valor médio de cada venda ou cliente.', why:'Aumentar o ticket médio é uma das formas mais eficientes de crescer sem precisar de mais clientes.', ideal:'Depende do setor, mas sempre busque aumentar sem perder volume.'}
  ];
  function renderGlossary(){
    var box = $('screen-glossary');
    var query = (renderGlossary._q || '').toLowerCase();
    var filtered = GLOSSARY.filter(function(g){
      return !query || g.term.toLowerCase().indexOf(query)>=0 || g.full.toLowerCase().indexOf(query)>=0;
    });
    var html = '<div class="field" style="max-width:320px;margin-bottom:18px;"><input class="input" id="glossSearch" placeholder="Buscar termo..." value="'+esc(renderGlossary._q||'')+'"></div>';
    html += filtered.map(function(g){
      return '<div class="gloss-card"><div class="gloss-head">'+g.icon+' <span class="term">'+esc(g.term)+'</span><span class="full">'+esc(g.full)+'</span></div>' +
        '<div class="gloss-sec">O que é</div><div class="gloss-text">'+esc(g.what)+'</div>' +
        '<div class="gloss-sec">Por que importa</div><div class="gloss-text">'+esc(g.why)+'</div>' +
        '<div class="gloss-ideal"><b>IDEAL:</b> '+esc(g.ideal)+'</div></div>';
    }).join('');
    box.innerHTML = html;
    $('glossSearch').addEventListener('input', function(){ renderGlossary._q = this.value; rerenderPreserveFocus(renderGlossary); });
  }


  // ============================================================
  // Exportação Excel (Relatório do Mês)
  // ============================================================
  function exportMonthReport(){
    if (typeof ExcelJS === 'undefined'){ alert('Biblioteca de exportação não carregada. Verifique sua conexão e tente novamente.'); return; }
    try {
      var month = getCurrentMonth();
      var profile = state.profile;
      var kpis = calcKPIs(month, profile);
      var health = kpis ? computeHealth(kpis, month) : null;
      var diag = kpis ? computeDiagnostics(kpis) : [];
      var wb = new ExcelJS.Workbook();
      wb.creator = 'Heryn Business';
      wb.created = new Date();

      function H(sheetName, colWidths, rows){
        var ws = wb.addWorksheet(sheetName);
        ws.columns = colWidths.map(function(w){ return { width: w }; });
        rows.forEach(function(row, idx){
          var r = ws.addRow(row.cells);
          if (row.header){
            r.eachCell(function(cell){
              cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3A2A12' } };
            });
          }
          if (row.bold){
            r.eachCell(function(cell){ cell.font = Object.assign({}, cell.font, { bold: true }); });
          }
        });
        return ws;
      }

      // --- Sheet 1: Resumo
      var resumoRows = [
        { header:true, cells:['Relatório Mensal — Heryn Business'] },
        { cells:['Empresa', profile.businessName || '—'] },
        { cells:['Mês de Referência', monthNameLong(state.currentYM)] },
        { cells:['Gerado em', new Date().toLocaleString('pt-BR')] },
        { cells:[''] },
        { header:true, cells:['Indicador', 'Valor'] },
        { cells:['Faturamento', kpis ? kpis.revenue : 0] },
        { cells:['Custos Variáveis', kpis ? kpis.varCosts : 0] },
        { cells:['Investimento em Marketing', kpis ? kpis.mktSpend : 0] },
        { cells:['Receita de Anúncios', kpis ? kpis.adRevenue : 0] },
        { cells:['Leads', kpis ? kpis.leads : 0] },
        { cells:['Novos Clientes', kpis ? kpis.newClients : 0] },
        { cells:['Custo Fixo Total', kpis ? kpis.fixedTotal : 0] },
        { cells:['Lucro Bruto', kpis ? kpis.grossProfit : 0] },
        { bold:true, cells:['Lucro Líquido', kpis ? kpis.netProfit : 0] },
        { cells:['Margem Bruta (%)', kpis ? Number(kpis.grossMargin.toFixed(1)) : 0] },
        { cells:['Margem Líquida (%)', kpis ? Number(kpis.netMargin.toFixed(1)) : 0] },
        { cells:['ROAS', kpis && kpis.roas!==null ? Number(kpis.roas.toFixed(2)) : '—'] },
        { cells:['CAC', kpis && kpis.cac!==null ? Number(kpis.cac.toFixed(2)) : '—'] },
        { cells:['Taxa de Conversão (%)', kpis && kpis.convRate!==null ? Number(kpis.convRate.toFixed(1)) : '—'] },
        { cells:['Break-even', kpis && kpis.breakEven!==null ? Number(kpis.breakEven.toFixed(2)) : '—'] },
        { cells:[''] },
        { header:true, cells:['Saúde Financeira', health ? (health.score + ' — ' + health.label) : '—'] }
      ];
      H('Resumo', [30,20], resumoRows);

      // --- Sheet 2: Orçamento por Setor
      var budgetRows = [ { header:true, cells:['Setor','Orçado','Gasto','Utilizado (%)','Status'] } ];
      (month.budgets||[]).forEach(function(b){
        var alloc = Number(b.allocated)||0, spent = Number(b.spent)||0;
        var pct = alloc>0 ? (spent/alloc)*100 : 0;
        var status = alloc===0 ? '—' : pct>100 ? 'Estourado' : pct>=80 ? 'Atenção' : 'Ok';
        budgetRows.push({ cells:[b.sector, alloc, spent, Number(pct.toFixed(1)), status] });
      });
      H('Orçamento por Setor', [24,14,14,16,14], budgetRows);

      // --- Sheet 3: Clientes
      var clientRows = [ { header:true, cells:['Nome','Valor','Status','Segmento','Notas'] } ];
      (month.clients||[]).forEach(function(c){
        clientRows.push({ cells:[c.name||'', Number(c.value)||0, c.status||'', c.segment||'', c.notes||''] });
      });
      H('Clientes', [24,14,14,18,30], clientRows);

      // --- Sheet 4: Meus Registros (filtrado ao mês corrente)
      var recRows = [ { header:true, cells:['Data','Descrição','Categoria','Tipo','Valor'] } ];
      state.records.filter(function(r){ return (r.date||'').slice(0,7) === state.currentYM; })
        .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); })
        .forEach(function(r){
          recRows.push({ cells:[fmtDateBR(r.date), r.description||'', r.category||'', r.type==='entrada'?'Entrada':'Saída', Number(r.value)||0] });
        });
      H('Meus Registros', [14,30,18,12,14], recRows);

      // --- Sheet 5: Diagnóstico JARVIS
      var diagRows = [ { header:true, cells:['Indicador','Valor','Status','Detalhe'] } ];
      var statusMap = { good:'Bom', warn:'Atenção', bad:'Ruim', neutral:'Neutro' };
      diag.forEach(function(d){
        diagRows.push({ cells:[d.label, d.value, statusMap[d.status]||d.status, d.detail||''] });
      });
      if (health){
        diagRows.push({ cells:[''] });
        diagRows.push({ bold:true, cells:['Pontuação de Saúde', health.score + ' — ' + health.label, '', ''] });
      }
      var alerts = kpis ? computeAlerts(kpis) : [];
      if (alerts.length){
        diagRows.push({ cells:[''] });
        diagRows.push({ header:true, cells:['Alertas','Nível','',''] });
        var levelMap = { critical:'Crítico' };
        alerts.forEach(function(a){
          diagRows.push({ cells:[a.title + (a.body?(' — '+a.body):''), levelMap[a.level] || 'Aviso', '', ''] });
        });
      }
      H('Diagnóstico JARVIS', [34,14,14,34], diagRows);

      var fname = 'Relatorio_' + (profile.businessName ? profile.businessName.replace(/[^a-zA-Z0-9]+/g,'_') : 'Heryn') + '_' + state.currentYM + '.xlsx';
      wb.xlsx.writeBuffer().then(function(buffer){
        var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      }).catch(function(err){
        console.error(err);
        alert('Não foi possível gerar o relatório. Tente novamente.');
      });
    } catch (err){
      console.error(err);
      alert('Não foi possível gerar o relatório. Tente novamente.');
    }
  }


  boot();

</script>
